name: conformance

on:
  push:
  pull_request:

jobs:
  fixtures:
    name: recompute fixtures from a clean checkout
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: fixture runner
        run: obravera-fingerprint-verifier fixtures fixtures/fingerprint
      - name: pytest
        run: python -m pytest -q
      - name: binary fixtures are reproducible
        run: |
          python tools/make_binary_fixtures.py
          git diff --exit-code -- fixtures/fingerprint/iscc-data/sources
