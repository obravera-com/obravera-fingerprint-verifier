[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obravera-fingerprint-verifier"
version = "0.1.0"
description = "ObraVera's open fingerprint verifier and conformance fixtures (ISCC and winnowing), offered as implementation evidence to the SPUR evidence working group"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Brady Ridgway", email = "brady@obravera.com" }]
keywords = ["spur", "content-telemetry", "iscc", "fingerprint", "provenance"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "iscc-core==1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14", "pre-commit>=4"]

[project.scripts]
obravera-fingerprint-verifier = "obravera_fingerprint_verifier.__main__:main"

[project.urls]
Homepage = "https://obravera.com"
Source = "https://github.com/obravera-com/obravera-fingerprint-verifier"
"SPUR Content Telemetry" = "https://github.com/SPUR-Coalition/telemetry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
# The floor this package supports, not the interpreter it happens to be
# developed on. A second implementer on 3.10 must see the same lint result.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
# ruff-format owns line length: it wraps everything it can safely split, so
# what E501 still reports is exactly what the formatter declined to touch --
# string literals. Several of those are registry row values that the CLI
# prints as published module metadata, and hand-wrapping them with implicit
# concatenation risks altering text other implementers read, to satisfy a rule
# the formatter has already enforced. line-length stays at 100 for the
# formatter; only the redundant lint rule is off.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
